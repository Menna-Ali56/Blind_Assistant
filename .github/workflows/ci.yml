name: Flutter CI Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter CI
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch contracts
        if: ${{ vars.CONTRACTS_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CONTRACTS_REPO }}
          ref: ${{ vars.CONTRACTS_TAG }}
          token: ${{ secrets.CONTRACTS_TOKEN }}
          path: contracts-source

      - name: Use fetched contracts
        if: ${{ vars.CONTRACTS_REPO != '' }}
        run: |
          rm -rf contracts
          cp -r contracts-source/contracts contracts
          rm -rf contracts-source

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug apk
        run: flutter build apk --debug
